{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card glass-card p-4 shadow-lg animate-fade-in border-0">
                <div class="text-center mb-4">
                    <div class="fs-1 text-success"><i class="bi bi-magic"></i></div>
                    <h2 class="fw-bold mt-2">{{ _t('crop_recommendation') }}</h2>
                    <p class="text-muted">{{ _t('recommend_subtitle') }}</p>
                </div>
                <hr class="mb-4">
                
                <form action="{{ url_for('recommend') }}" method="POST">
                    <div class="row g-4">
                        
                        <!-- Soil Nutrients Section -->
                        <div class="col-md-6 border-end">
                            <h4 class="h5 mb-3 text-primary"><i class="bi bi-clipboard-data"></i> {{ _t('soil_nutrients_heading') }}</h4>
                            
                            <div class="mb-3">
                                <label for="n" class="form-label form-label-custom">
                                    {{ _t('nitrogen') }} 
                                    <i class="bi bi-question-circle text-muted" data-bs-toggle="tooltip" title="{{ _t('tooltip_nitrogen') }}"></i>
                                </label>
                                <input type="number" class="form-control form-control-custom" id="n" name="n" required min="0" max="200" placeholder="{{ _t('eg') }} 50">
                            </div>
                            
                            <div class="mb-3">
                                <label for="p" class="form-label form-label-custom">
                                    {{ _t('phosphorus') }} 
                                    <i class="bi bi-question-circle text-muted" data-bs-toggle="tooltip" title="{{ _t('tooltip_phosphorus') }}"></i>
                                </label>
                                <input type="number" class="form-control form-control-custom" id="p" name="p" required min="0" max="200" placeholder="{{ _t('eg') }} 50">
                            </div>
                            
                            <div class="mb-3">
                                <label for="k" class="form-label form-label-custom">
                                    {{ _t('potassium') }} 
                                    <i class="bi bi-question-circle text-muted" data-bs-toggle="tooltip" title="{{ _t('tooltip_potassium') }}"></i>
                                </label>
                                <input type="number" class="form-control form-control-custom" id="k" name="k" required min="0" max="300" placeholder="{{ _t('eg') }} 50">
                            </div>
                            
                            <div class="mb-3">
                                <label for="ph" class="form-label form-label-custom">
                                    {{ _t('ph') }} 
                                    <i class="bi bi-question-circle text-muted" data-bs-toggle="tooltip" title="{{ _t('tooltip_ph') }}"></i>
                                </label>
                                <input type="number" step="0.1" class="form-control form-control-custom" id="ph" name="ph" required min="3.5" max="9.0" placeholder="{{ _t('eg') }} 6.5">
                            </div>
                        </div>
                        
                        <!-- Environment & Farm Size Section -->
                        <div class="col-md-6">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h4 class="h5 text-primary mb-0"><i class="bi bi-cloud-sun"></i> {{ _t('weather_farm_heading') }}</h4>
                                <button type="button" class="btn btn-sm btn-outline-success" onclick="fillMockWeather()" title="{{ _t('quick_fill_tooltip') }}">{{ _t('quick_fill_weather') }}</button>
                            </div>
                            
                            <div class="mb-3">
                                <label for="temperature" class="form-label form-label-custom">
                                    {{ _t('temperature') }}
                                </label>
                                <input type="number" step="0.1" class="form-control form-control-custom" id="temperature" name="temperature" required placeholder="{{ _t('eg') }} 28.5">
                            </div>
                            
                            <div class="mb-3">
                                <label for="humidity" class="form-label form-label-custom">
                                    {{ _t('humidity') }}
                                </label>
                                <input type="number" step="0.1" class="form-control form-control-custom" id="humidity" name="humidity" required placeholder="{{ _t('eg') }} 70">
                            </div>
                            
                            <div class="mb-3">
                                <label for="rainfall" class="form-label form-label-custom">
                                    {{ _t('rainfall') }}
                                    <i class="bi bi-question-circle text-muted" data-bs-toggle="tooltip" title="{{ _t('tooltip_rainfall') }}"></i>
                                </label>
                                <input type="number" step="0.1" class="form-control form-control-custom" id="rainfall" name="rainfall" required placeholder="{{ _t('eg') }} 150">
                            </div>
                            
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="soil_type" class="form-label form-label-custom">{{ _t('soil_type') }}</label>
                                    <select class="form-select form-control-custom" id="soil_type" name="soil_type" required>
                                        <option value="Loamy">{{ _t('loamy') }}</option>
                                        <option value="Clayey">{{ _t('clayey') }}</option>
                                        <option value="Sandy">{{ _t('sandy') }}</option>
                                        <option value="Black">{{ _t('black') }}</option>
                                        <option value="Red">{{ _t('red') }}</option>
                                        <option value="Alluvial">{{ _t('alluvial') }}</option>
                                    </select>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="farm_size" class="form-label form-label-custom">{{ _t('farm_size') }}</label>
                                    <input type="number" step="0.1" class="form-control form-control-custom" id="farm_size" name="farm_size" required min="0.1" placeholder="{{ _t('eg') }} 2.5">
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    
                    <div class="text-center mt-5">
                        <button type="submit" class="btn btn-custom btn-lg px-5 py-3"><i class="bi bi-check2-circle"></i> {{ _t('get_recommendation') }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function fillMockWeather() {
        document.getElementById('temperature').value = (24.0 + Math.random() * 10).toFixed(1);
        document.getElementById('humidity').value = (50 + Math.random() * 35).toFixed(0);
        document.getElementById('rainfall').value = (40 + Math.random() * 180).toFixed(1);
    }
</script>
{% endblock %}
